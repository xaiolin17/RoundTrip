# GoldAgent 可调参数（热配置：改完重启 main.py 生效）
# 调参历史见本文件底部注释

[decision]
# 开仓阈值：|S| 达到此值才允许开新仓（1.6 过严，当前行情峰值 1.29；降至 1.2 加速采样）
open_threshold = 1.2
# 平仓阈值：持仓时反向信号达此值计入平仓计数
exit_threshold = 1.2
# 连续 N 轮反向才主动平仓
exit_persist_rounds = 3
# 主循环间隔（秒）
loop_interval_s = 60.0

[fusion]
# 信号源分歧度上限（超过则不开仓）
sigma_max = 0.8
# Hurst 分析窗口
hurst_window = 500
# 贝叶斯滚动窗口
bayes_window = 50

[risk]
# 单笔风险占净值比例（0.5%）
risk_pct = 0.005
# 目标日波动率（1%）
target_vol_daily = 0.01
# SL/TP 的 ATR 倍数（挂单时另有收缩规则，见 docs/05 §3b）
sl_atr_mult = 1.2
tp_atr_mult = 2.0
# 最长持仓时间（小时）
max_holding_h = 48.0

