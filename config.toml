# GoldAgent 可调参数（热配置：改完重启 main.py 生效）
# 调参历史见本文件底部注释
#
# ⚠️ 纪律（research/18_COMMERCIAL_PLAN.md P2-1）：
#    任何参数变更必须附一个 research/ 脚本产出的 DSR 数字。没有 = 回滚。
#    试验族规模 N 必须显式记录在 data/trials.csv（每试一个参数 +1）。

[decision]
# ---- 开/平仓门槛：**z 尺度**（尺度无关），不是融合分的绝对值 ----
#
# ⚠️ 2026-09-29 第四次修正（用户指出的隐蔽耦合）
# ---------------------------------------------
# 融合分 S 是**加权平均** S = Σwμ/Σw，故它的尺度恰好是
#     sd(S) = 1/√Σw = FusionResult.sigma
# 而旧实现用**绝对常数**去比它：`abs(S_eff) >= open_threshold`。
# 于是同一行代码的含义随权重漂移：
#     Σw = 4.17（旧冻结基线）→ σ=0.4895 → |S|≥1.3 实为 |z|≥2.66
#     Σw = 12.0（等权收缩）  → σ=0.2887 → |S|≥1.3 实为 |z|≥4.50
# 即 **权重越大（越有把握）→ 越难开仓**，方向正好反了。
# 用户原话：「本来要改的就是权重影响开仓 但是权重即会增大也会减小才对」。
#
# 改成 z 尺度后，权重对开仓的影响变成**双向且方向正确**：
#     源越多/越确定 → Σw 大 → σ 小 → 同样强度信号 z 更大 → 更容易开
#     源被剔除/不确定 → Σw 小 → σ 大 → 更难开
# 实测（60,000 根真实 1m bar，305 轮 x2 段）等权下按 Σw 缩放：
#     Σw= 6.0 → 开仓率  5.0% /  5.3%
#     Σw=12.0 → 开仓率 15.7% / 16.0%
#     Σw=24.0 → 开仓率 32.3% / 25.7%
#     Σw=48.0 → 开仓率 49.0% / 43.3%   ← 单调递增，方向正确
#
# 而且 z_min 从此与权重**解耦**：以后权重怎么变，都不会再静默改掉入场松紧。
#
# 标定：z_min = 2.66 取自**当前实际生效**的 z（1.3 / 0.4895 = 2.655），
# 故本次改动不改变入场松紧，只把耦合去掉。
z_min = 2.66
# 平仓的 z 门槛：原 exit_threshold=1.2 的等效 z（1.2 / 0.4895 = 2.452）。
z_exit = 2.45
# 信号回吐平仓的 **z 落差**（峰值 z − 当前 z）：
# 原 reserve_drop_score=0.6 的等效 z（0.6 / 0.4895 = 1.226）。
reserve_drop_z = 1.23
#
# ⚠️ 下面两个绝对阈值**已不参与判定**，仅为历史记录与参数门显示保留。
#    真实判定一律走 z_min / z_exit / reserve_drop_z（见 decision/machine.py）。
#    2026-09-20 research/22_param_gate.py 在 60,000 根真实 1m bar 上对
#    [1.0..1.6] 全部候选做 DSR + PBO + MinBTL + Purged K-Fold：**没有一个通过**
#    （DSR 全 0、PBO = 1.0、MinBTL 判定数据仅 0.17 年 < 所需 2.13 年）。
#    → 这个参数没有统计证据支持任何取值，1.3 只是中性默认。
#      真正的结论是：不该继续微调它，应把精力放在止损宽度与信息源上。
open_threshold = 1.3
# 平仓阈值（已废弃，见上）
exit_threshold = 1.2
# ⚠️ `exit_persist_rounds` 已于 2026-09-30 **删除**。
#    平仓判据改为「窗口不一致率」（见下方 exit_adverse_window / exit_adverse_rate），
#    代码里已无人读它 —— 留着就是"改了没反应"的死配置。
# 主循环间隔（秒）—— **1m 短线交易，用户明确要求**
#
# ⚠️ 曾按 research/18 §P1-1 改成 3600（1h），理由写的是"1m 盈亏平衡 IC>0.50"。
#    但那个论证的前提是**用 1m 的波动去定止损**。research/23_kalman_tb.py 实测：
#
#      止损基准        止损(USD)   成本/止损   净NW-t
#      1m ATR x1.2       1.13      46.0%     -30.00
#      15m 尺度 x1.2     4.74      11.0%      -4.38
#      1h ATR x1.2      20.80       2.5%      -1.40
#
#    → 1m **入场**没问题，问题是用 1m 的波动定止损（成本占止损 46%）。
#      改用 1h ATR 定止损后，成本只占 2.5%，净 NW-t 从 -30 改善到 -1.4。
#    → 所以保留 1m 决策周期，把止损宽度交给高级别（见 [risk] sl_atr_mult）。
loop_interval_s = 60.0
# 移动止损锁盈（用户选定，替代旧"回吐平仓"）
# ⚠️ 旧逻辑"浮盈回吐 50% 就平仓"实测砍掉 30%~75% 浮盈：
#    2558982555 MFE$11.63 -> 平$2.96；实际 RR 0.64 << 计划 1.28。
# 现在：浮盈 >= lock_profit_min_usd 后，把 SL 推到开仓价上方 lock_profit_gap_usd
# 锁盈（让利润奔跑）；仅当浮盈从峰值回落到保本线以下才离场。
lock_profit_min_usd = 8.0
lock_profit_gap_usd = 2.0
# ---- 主动平仓闸（用户 2026-09-30 要求）----
# 用户原话：「除非行情和持仓方向不一致率非常高，否则不轻易主动平仓，
#            只修改止损和止盈位置（新止损止盈缩小时不受 1.2 倍的比例影响）」。
#
# 为什么把「连续 3 轮逆向」换成「窗口不一致率」：
#   实测 09-23~09-30 共 2283 个持仓决策轮，**46% 是逆向轮**（逐日 29%~69%）。
#   在这种基础发生率下，「连续 3 轮逆向」几乎必然出现 —— 实测触发 **129 次**
#   （按连续段去重），属噪声驱动的过度交易，不是风控。
#   换成尾部窗口的**比例**后，只有真正持续一边倒才离场：
#   同一批数据旧规则 129 次 -> 新规则 **7 次**（降 95%）。
#   窗口/阈值实测（按连续段去重）：
#     5 轮 / 80%  -> 过多      10 轮 / 80% -> 偏多
#     20 轮 / 80% -> 7 次  <- 采用
#   20 轮 ≈ 25 分钟（实测轮间隔中位 76s），足够构成"持续"，
#   又不会慢到错过真实反转。
exit_adverse_window = 20
exit_adverse_rate = 0.80
# 信号转弱时收窄止损止盈的赔率（只用于**定目标位**）。
# ⚠️ 收窄动作本身**不受 min_rr 约束**（用户明确要求）：收窄是降低风险敞口，
#    用开仓的赔率门去卡它在语义上就是错的。gate 的 modify 分支也本就早返回。
signal_exit_tp_rr = 1.2
# 信号回吐检测（信号本身转弱时平仓，与移动止损互补）—— 见文件上方 reserve_drop_z
# P1-2 波动 regime 闸：只在 σ 位于滚动高分位时开仓
# （research/12_levers.py C1：≥90% 分位时毛边际 +171%、净 NW-t 改善 7 倍）
# 0.0 = 关闭；建议先用 0.5 观察，再逐步提到 0.9
vol_pct_min = 0.0
# LLM 一致性门槛（aligned 的判定用）
# ⚠️ 实测警告：372 个 review 的 confidence **最大值只有 0.550**，平均 0.357，
#    没有任何一次达到 0.60。所以当"aligned 才市价开仓"时，市价开仓恒不触发
#    （open_market 提案数 = 0，死代码）—— 这正是"很难下单"的根因。
#    LLM 给低置信度是诚实的：它自报 chanlun_mode=structure_proxy、
#    probability_tier=very_low。
#    现在市价开仓的条件改为「信号够强 且 LLM 未明确反对」，
#    本项只用于日志里标注"一致/不一致"，不再作为开仓的硬门槛。
llm_align_conf = 0.6
# 持仓时 LLM 反向 verdict 触发平仓的 confidence 门槛
llm_adverse_conf = 0.7
# 未对齐 LLM 时是否仍允许挂网格。
# research/20_llm_audit：LLM 缺失时默认走 place_grid，导致 30 次挂单 vs 16 次市价，
# 系统"绝大多数时候只能挂限价单"。设 false → LLM 缺失时直接 hold，等明确表态。
allow_grid_without_llm = true
# 只在均值回归 regime 用挂单，其余一律市价开仓（用户选定）。
# 用户原话："现在这种很难下单 我们要考虑用直接按照市价开仓 少用挂单"
# 实测依据：
#   · 挂单 65.5% 最终被撤销（有效期 4 小时，白等）
#   · 挂单存在期间 `_decide_flat` 不执行 -> 强信号被阻塞 167 轮
pending_only_in_mean_revert = true

# ---- news「独立证据」通道 ----
# ⚠️ 为什么 news 不给方向权重：fusion/weights.py 的硬规则是
#    「没有实测 IR 数字的源 = 0 权重」。news 从未做过 IR 校准。
# 但 news 原先**完全没用上**：实测 7874 轮里它从未进入 per_source
#    （权重 0 被 gaussian.fuse 排除），LLM 拿到情绪后触发的那次
#    `fuse_all` 重融合实测融合分一字不变（news_score 0→+1.5→-1.5，
#    融合分恒为 +1.438195），是纯空操作。
# 所以改成事件风险闸：不影响方向，只影响"要不要开、开多大"。
#
# LLM 新闻影响度（0~1）>= 此值 → 不开新仓（等事件过去）
news_impact_block = 0.7
# LLM 新闻影响度 >= 此值 → 新仓手数 × news_impact_lot_mult
news_impact_reduce = 0.4
# LLM 新闻影响度 >= 此值 **且与持仓反向** → 立即平仓评估（docs/06 §3.2 / docs/07）。
# ⚠️ 原为 machine.py 硬编码 0.8 —— 三个新闻档位里唯一不可调的那个，
#    调 news_impact_block 对已持仓的反向平仓毫无影响（假参数）。现补齐。
news_impact_close = 0.8
# 事件降级时的手数系数
news_impact_lot_mult = 0.5
# 权重**未校准**时的手数系数（见 [fusion] 里 DL 收缩的说明）。
# 当 lambda < LAMBDA_CALIBRATED(0.5) 时，说明当前样本分辨不出源的高下
# （三个可测源等权）。这**不是**不开仓的理由 —— 把统计功效不足做成
# 开/不开的开关，正是被修掉的缺陷 —— 而是**降仓**的理由：
# 低置信度 → 小仓位。数据足以排序后（lambda ≥ 0.5）本系数自动失效。
uncalibrated_lot_mult = 0.5

[fusion]
# 信号源分歧度上限（超过则不开仓）
sigma_max = 0.8
# ---- 权重校准：DL 收缩（**没有策略开关**）----
# 历史：这里曾有一个 `source_ir_policy` 二选一开关，两个取值都是错的 ——
#   · baseline_fallback：文件 verified=false 的源用 BASELINE_IR 硬编码常数
#     （0.28/0.05/0.03）覆盖 → **校准结果无法影响权重**（实测：写入一份
#     "四个源全部未通过"的文件，权重一模一样）＝校准文件是装饰性的。
#   · authoritative：文件判定即终审，未通过 → 0 权重 → 四个源全 0
#     → 融合分恒为 0 → **系统不会开仓**。
#   两个方案都必然留下一段死代码，而根因是**把统计估计做成了二值开关**。
#   该开关与其兜底表 BASELINE_IR 已删除（后者还是伪造的先验：kalman 的
#   0.28 比它自己的出处 research/11 的 t=3.31 → IR=0.01353 大 20.7 倍）。
#
# 现在：权重由 `fusion/weights.py` 的 DerSimonian-Laird 收缩算出，
#   没有任何开关，校准**永远**影响权重，影响多少由它自身信息量决定：
#       skill_i = t_i − 方向匹配对照均值_i
#       tau^2 = max(0, (Q − df)/C),   lambda = tau^2/(tau^2 + 1)
#       w_i = lambda·(skill_i/skill_max)^2·W_SCALE + (1−lambda)·W_SCALE
#   lambda = 0 → 源间差异不显著于抽样噪声 → 等权（**不拟合噪声**）
#   lambda → 1 → 差异确凿 → 完全采用实测排序
#
# 依据（本窗口实测）：三源 skill = −0.19/−0.35/+0.17，Q≈0.14 < df=2
#   → tau^2 = 0 → lambda = 0 → 三个可测源等权，Σw=12 → σ=0.289 过闸。
#   这不是"兜底"，是数据给出的答案：独立样本仅 316~380，
#   80% 功效需真实 t ≥ 2.80，而实测 t 只有 +0.31/+0.17/+0.67
#   —— 是**分辨不出来**，不是**测不出东西**。
#
# openmobius_smc 仍为 0 权重：它**不是**"不显著"，而是 Mobius API
#   **无历史回放**（分数来自离线桩），属结构性不可测（NO_HISTORY_SOURCES）。
#   把"不显著"与"不可测"混为一谈，正是上面那个缺陷的根源。
#
# Hurst 分析窗口
hurst_window = 500
# 贝叶斯滚动窗口
bayes_window = 50
# 贝叶斯证据**负向钳制**（用户选定：表现差的源不能无限反打）
# ⚠️ 事故背景：贝叶斯池 9胜20负（p=0.32）-> evidence 的 logit=-0.74
#    -> 分数为正时每个源被压 -0.94，4 源叠加把融合分拉低 0.3~0.5，
#      加上信号源走弱，508 轮无一达到开仓阈值 1.3。
# 现在：负证据最多压到 -bayes_evidence_floor，避免"越亏越反向"的自我强化；
# 正证据不钳制（表现好的源应充分投票）。
bayes_evidence_floor = 0.3
# ---- P0-1 源去均值（滚动 z-score，消除结构性常数偏移）----
# 依据：research/16_live_audit —— mobius 源 88% 为正、均值 +1.2604 是偏置不是预测。
# ⚠️ 该数字**已过期**（只统计 0918-0920 三天、且是 0921 换聚合口径**之前**的
#    单 15m 口径）。0921 起 mobius 改为多周期加权聚合，该统计量不可复现；
#    实测 0921-0929 均值已变为 −2.56（黄金同期从 4334 跌到 4169，方向正确，
#    真正的问题是 clip 饱和导致分辨率丢失）。
#    **去均值机制本身仍然必要**（任何源都可能有常数偏移），但不要再用
#    +1.2604 这个具体数字论证它。详见 mobius_adapter._score_fn 的说明。
# 验收：连续运行 ≥3 天后各源 score 均值 ∈ [−0.3,+0.3]，为正比例 ∈ [40%,60%]
#
# 窗口单位是**观测次数 = 决策轮数**。决策周期回到 1m（60s）后，
# 1440 轮 = 1 天、240 轮 = 4 小时预热 —— 这是 1m 时代的原值，正确。
norm_window = 1440
norm_min_periods = 240
# ---- P1-2 波动分位窗口（同上：单位是决策轮数）----
vol_pct_window = 1440
vol_pct_min_periods = 240
# ---- P1-3 融合分滚动基线（阈值零点校正）----
baseline_window = 1440
baseline_min_periods = 240
# ---- 启动预热 ----
# ⚠️ 关键：上面三个 min_periods 的单位是**决策轮数**。1m 周期下 240 轮 = 4 小时。
#    不预热 → 启动后 4 小时内所有源归一化分都是 0.0 → 融合分恒 0 → 永不开仓。
#    （实盘已复现：跑 180 轮后 count=180 < 240，score 全程 0.0。）
#    启动时回放最近 prime_steps 轮真实 bar 把缓冲灌满，第一轮即可正常决策。
#    实测：预热后 |S|≥1.3 的轮次占 25.5% → 交易频率正常。
prime_steps = 300
prime_step_bars = 1

[llm]
# 评审（LLM-A）每小时预算；与新闻面分开计账
# research/20：两者共用 24 次/小时的池子时，news 把 review 的额度吃光
# （budget_exhausted 150 次），review 覆盖率只剩 4.3%
#
# ⚠️ 24 -> 60：循环间隔 60s = **每小时 60 轮**，而预算只有 24，
#    实测 budget_exhausted 642 次（每小时约 50 次），
#    review 可用率仅 372/693 = 53.7%。
#    用户选定提到 60 以覆盖每一轮 —— LLM 是市价开仓的确认环节，
#    它不可用时会因拿不到压力位而无法开仓（llm_no_levels）。
per_hour_budget = 60
# 新闻面（LLM-B）每小时预算，独立于 review
news_per_hour_budget = 24
# 评审最小间隔（分钟）。1h 决策周期下 = 0（每轮都评审，这才是"LLM 主路径"）
min_interval_min = 0.0
# review 失败重试次数（换温度 0）
retry = 1
timeout_s = 60.0
review_timeout_s = 60.0
news_timeout_s = 30.0

[risk]
# 连续亏损熔断：连亏 N 笔后冷却暂停（用户选定 15 分钟）
# ⚠️ 4h -> 15min：1m 短线冷却 4 小时等于当天报废（实测 4576 轮后
#    一直"冷却至 17:55"，强信号 5 轮全被拦）。15 分钟足够冷静。
consecutive_loss_n = 4
consecutive_loss_cooloff_h = 0.25

# 单笔风险占净值比例（0.5%）
#
# ⚠️ 这个值是**名义预算**：0.01 手（交易所最小手数）的实际风险只要不超过它，
#    就允许开仓，即使缩仓系数（vol_k）把"预算内手数"压到了 0.01 以下。
#    实测事故：vol_k=0.125（波动下限 0.25 × 分歧 0.5）→ 预算 8.64 USD
#    → 止损上限仅 8.6 点，而实际止损 7.5~20.8 点 → 强信号轮次被连续拦截
#    （3514/3515），用户反馈"现在没有开仓"。
#    而 0.01 手 + 20 点止损 = 20.82 USD = 权益 0.145%，远低于这里的 0.500%
#    —— 系统在拒绝一个风险只有自设上限 29% 的仓位。
#    0.01 手是交易所下限，不能再往下取整，所以缩仓系数不该变成"禁止交易"。
#    超出本预算的宽止损**仍然拦截**（硬风控不变）。
risk_pct = 0.005
# 目标日波动率（1%）
target_vol_daily = 0.01
# SL/TP 的 ATR 倍数（再叠收缩：市价/挂单 TP×0.6 SL×0.8）
sl_atr_mult = 1.2
tp_atr_mult = 2.0
# ---- 缠论结构定价（用户要求）----
# 用户原话：止盈止损要考虑缠论的「回调幅度 0.618」「分型区间两倍」
#           「沿趋势上行」这些比率增长来计算，不能采用直接的 ATR。
#
# 实现见 src/gold_agent/risk/structure.py：
#   止损 = 最近同向走势段（线段优先，退到笔）的 0.618 回调位
#   止盈 = 该段的 1.618 扩展位（终点 ± 0.618×幅度）
#   宽度 = 用「分型区间两倍」校验，超出则退回 ATR
#
# structure_tf 实测差异（现价 4353.5）：
#   15m 分型两倍= 33.8 / 1h= 73.8 / 4h= 149.0  —— 差 4.4 倍
# 用户选定 15m。
structure_tf = "15m"
# 结构止损**下限**宽度（×ATR）——防贴脸止损（实测 15m 笔只给 0.243）。
# ⚠️ 原 `structure_sl_max_atr` / `structure_frac_lo` / `structure_frac_hi`
#    与 `structure_enabled` 全项目零引用，已删除。上限本就被风险预算兜住：
#    实测 sl_dist 5→300 点时实际风险恒 ≤0.500%（名义预算），更宽则直接拒单，
#    故删除不降低保护。
structure_sl_min_atr = 0.5
# ---- 压力位/支撑位定价（用户要求）----
# 用户原话：0.618 是【入场点位】（回调到位反弹概率大），
#           止盈止损得看【压力位】，可以把 skill 的输出给 LLM 来判断。
#
# 实现见 src/gold_agent/risk/levels.py：
#   LLM 读 skill 输出（缠论中枢 / SMC OB / FVG / equal HL）给出
#   support_levels / resistance_levels / sl_hint / tp_hint，
#   本地再配套计算最终 sl/tp 并做方向、最小距离、盈亏比校验。
#
# 止损放在支撑/压力位之外额外让开的距离（×ATR），防贴边被扫
level_pad_atr = 0.25

# 「融合分 vs 结构位」冲突判定的贴脸阈值（×ATR）
#
# ⚠️ 原为 levels.py 里 6 处硬编码 `0.3`，是实测 180 次
#    `fusion_vs_levels_conflict` 拒绝里 **159 次**的唯一驱动常数，
#    而同段的 structure_sl_min_atr / level_pad_atr 早已走配置 —— 想调
#    却无处可调。提到配置里，默认 0.3 保持行为完全不变。
#
# 实测背景：该闸共拦下 180/279（64.5%）风控拒绝，是当前**最主要的拦截来源**。
# 方向分布：做空贴支撑 107 / 做多贴压力 73。
# 若发现"该开的仓被拦"，调小此值即可（0.2 ≈ 3 点）。
conflict_atr_mult = 0.3
# 贴脸反向位**不再硬拒**，改为按此系数降仓（0.0 = 恢复旧的硬拒行为）。
# 实证见 research/26_conflict_gate_test.py（13879 样本 / 61 天 / 5 个前瞻窗口）：
# 贴脸组远期收益与对照组**统计上无差异**（全部 |t|<1.96，日块自助 20/20 格
# 不显著），而原实现把 205 个强信号（|z|>=2.66）100% 挡掉。
# 但该研究检出力只到约 2~3 点，不足以证明安全，故保留风控、只降仓。
conflict_lot_mult = 0.5

# Kelly 冷启动胜率（交割单样本 < min_deals_for_kelly 时使用）
cold_start_win_rate = 0.5
# 限价挂单有效期（小时）——到期由 MT5 自动撤销
pending_expiry_h = 4.0

# 新闻高危窗口熔断是否生效
#
# ⚠️ 原实现把 `high_risk_window=False` **写死**在 gate.py 的调用处，
#    于是 CircuitBreakers 里的 news_high_risk_window 分支从未触发过一次，
#    配套的 news_blackout_min 也成了无人读取的死配置。代码注释声称
#    「news 高危由 decision 传入 flags」，但 decision 层只做 hold 与降手数，
#    并不回传任何熔断标志 —— 这条熔断实际是被静默摘掉的。
#    改为可配置。**默认 false 保持既有行为**（本次只修"不可观测/不可配置"，
#    不擅自改变风控松紧）。要真正启用新闻熔断就把它改成 true。
news_high_risk_window = false

# 同方向的"贴脸"判定最小距离（×ATR）——结构位定价用
# 最小盈亏比：止盈距离 < 止损距离 × 该值 → 不开仓
min_rr = 1.2
# LLM 没给出可用压力位时是否仍允许开仓
#
# ⚠️ 语义澄清（用户原话）：
#   "我的意思是LLM没有相反的预测方向 并且当前距离我们盈利的压力位
#    也有距离就可以直接市价开仓"
#
# 即：**点位的来源不必是 LLM**。
#   · LLM 的职责 = 方向否决（decision 层的 opposed，反向且高置信才拦）
#   · "离盈利压力位还有距离" = 赔率检查（下面的 min_rr）
#   · 点位来源 = LLM 给的 或 **本地结构位**（缠论中枢 / SMC OB / FVG）
#     —— levels.py 会两者合并，本地结构位独立可用。
#
# 本项保持 **false**，含义是"**两个来源都没有点位**时不开仓"。
# 注意它**不是**"LLM 没给就不开仓" —— LLM 没给但本地结构位有时，
# `lv.ok` 已经是 True，根本走不到这个闸。
# 保留它是为了兜住最坏情况：没有任何点位依据时不开**裸仓**
# （实测过裸仓事故：加仓开出 SL=0 TP=0 的仓位）。
allow_trade_without_llm_levels = false

# ---- 自研回调检测（用户要求：非严格缠论要加上我们直接的处理）----
# 用户原话：非严格缠论 要加上我们直接的处理 缠论结果只是第一层数据
#           然后根据最新的挂单来看 参考的周期大了啊 我需要小周期判断
#           加大入场次数
#
# 为什么必须自研：实测缠论代理引擎在 **1m 图上返回的是 15m 级别的段**
# （1m 报的段 4348.322->4365.234 与 15m 完全相同），于是入场位离现价
# 12~32 点，挂单几乎不可能成交。我们自己的摆动检测在同一时刻给出
# 0.589 点的距离。
#
# 扫这些小周期，选「段幅度过噪音门槛 且 入场带离现价最近」的那个
pullback_tfs = ["1m", "2m", "5m", "10m", "15m", "30m"]
# 摆动确认根数（左右各 k 根），多试几个 k 提高候选覆盖
pullback_swing_k = [1, 2, 3]
# 段幅度噪音门槛（×ATR）：实测 1m k=1 会给出 2.8 点的纯噪音段，
# 0.25×ATR 能正确滤掉
pullback_min_leg_atr = 0.25
# 回调带两条边 —— 用户选定"0.5~0.618 挂单带，带内挂一单"
# 实测成交率提升：2m 79.6%->86.7%，15m 73.8%->86.2%
# 挂单价取带内离现价最近的边，仍只挂一张单（不恢复网格）
pullback_band_near = 0.5
pullback_band_far = 0.618

# ---- 中枢位置闸（用户反馈："我经常看到中枢中部位置就下单了"）----
# 用户原话：要么在中枢两端下中枢的单子 要么做突破的单子
#           还是以周期1m和5m为主
#
# 诊断（实测 127 笔真实单子）：123 笔走的是
#   machine.py -> Proposal(kind="open_market", entry=ctx.last_close)
# 即"上一根 1m 收盘价"，全链路没有一行代码读中枢。
# 配对零假设检验（每笔单子取 ±8h 内 20 个随机时刻的真实市价作对照）：
#   真实入场落在区间中间 60% 的比例   56.6%
#   随机时刻入场的对照比例          57.1%   差 -0.5pp，95%CI [-9.3,+8.0] 不显著
# -> 系统择时与"随机时刻按市价入场"统计上无法区分，这正是缺失中枢
#    位置逻辑的必然结果，不是可以调参纠正的偏差。
# 用户观察本身是对的：79~80% 的单子落在中间 60%，
# 到最近边界的中位距离 14.1 点 > 整笔止损距离（中位 9.78 点）。
#
# 第一步（本轮）：只加硬闸，禁止在中枢中部开新仓。
zhongshu_gate = true
# 判定"贴边"的归一化带宽：两端各 30%，即中部 40% 为禁区。
# 取不到有效中枢时**放行**（保守：不因缺数据而变成永不开仓）。
zhongshu_edge_band = 0.30
# 优先 5m（宽度中位 9.43 点，语义最合适），1m 兜底。
# 实测退化率(zg==zd)：1m 18% / 5m 25% / 15m 24% —— 1m 噪音大，
# 不能单独决策，只在 5m 拿不到时兜底。
zhongshu_tfs = ["5m", "1m"]
# 中枢宽度下限（×ATR）：低于此值说明中枢被压扁、边界在噪音里，
# 不作为判据（实测宽度/ATR 中位：1m 2.14 / 5m 1.77）
zhongshu_min_width_atr = 0.25
# ---- ⚠️ 1m 短线能否成立的关键：止损用哪个周期的 ATR ----
#
# research/23_kalman_tb.py 实测（60,000 根真实 1m bar，成本 0.52 USD）：
#
#   止损基准        止损(USD)   成本/止损   净NW-t
#   1m ATR x1.2       1.13      46.0%     -30.00
#   15m 尺度 x1.2     4.74      11.0%      -4.38
#   1h ATR x1.2      20.80       2.5%      -1.40
#
# 成本固定，止损越窄，成本占比越高。用 1m 波动定止损 → 成本吃掉 46%，
# 数学上不可能盈利。这正是 research/18 §P1-1「1m 盈亏平衡 IC>0.50」的来源。
#
# → 1m 负责**入场择时**，高级别负责**风险尺度**。
#    改回 "1m" 会让系统退化回净 NW-t = -30 的绝望区，**不要改**。
atr_tf = "1h"
# 最长持仓时间（小时）—— 1m 短线：4 小时上限
max_holding_h = 4.0
# ---- 限价挂单（用户要求：取消网格，只挂预测的那一单）----
# ⚠️ 挂单的回踩距离**不由本段任何键控制**：实际距离来自结构/ATR 计算
#    （见 risk/structure.py 与 risk/gate.py 的 place_grid 分支）。
#    原注释声称 `grid_atr_mult` 用来算回踩距离 —— 该键全项目零引用，
#    是一句**假注释**，已连同键一起删除（用户要求：不留无作用的死代码）。
# ---- P2-2 方向偏置熔断（research/16：3 笔全 LONG，结构性做多）----
direction_bias_window = 100
direction_bias_max = 0.85
direction_bias_min_samples = 20
# ---- P2-3 交割单样本量门槛（3 笔就参与 Kelly 是危险的）----
min_deals_for_kelly = 10

