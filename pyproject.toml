[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-agent"
version = "0.1.0"
description = "XAUUSDm autonomous trading agent: MT5 + LangChain 1.2 + openmobius/chanlun skills + Kalman/Bayesian/Gaussian fusion"
requires-python = ">=3.12"
dependencies = [
  "MetaTrader5>=5.0.45",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "filterpy>=1.4.5",
  "pyarrow>=14",
  "langchain>=1.2,<2",
  "langgraph>=1.0",
  "openai>=1.50",
  "python-dotenv>=1.0",
  "aiohttp>=3.9",
  "tenacity>=8.2",
  "orjson>=3.9",
  "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 600
